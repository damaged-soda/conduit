# conduit-service：本文件即生产接线（personal 域架构规范「接线即默认值」，
# 2026-08-10 裁决）——dev 与生产同一份，默认值可直接上生产：
#   生产 / rig：docker compose -f deploy/compose.yaml pull \
#              && docker compose -f deploy/compose.yaml up -d --no-build --pull never
#              （&& 短路 + --no-build --pull never 缺一不可：Compose 对可构建服务
#              会吞掉拉取错误回退本机构建，显式 pull 才 fail loud、up 禁构建禁重拉。
#              发布特定版本：CONDUIT_IMAGE_TAG=vX.Y.Z 对两条命令同时注入，不写 .env）
#   本地开发：  docker compose -f deploy/compose.yaml up -d --build
# 迁移状态：conduit 切到新部署面之前，rig 生产仍由 fleet-deploy（pin → bump → sync）
# 执行，本文件届时接管（过渡态见 ~/work/personal/AGENTS.md「过渡状态」节）。
# tailnet 暴露不在本文件内：宿主 Tailscale Serve 承担（svc:conduit → 127.0.0.1:8000）。
name: conduit-service

services:
  conduit:
    # 默认跟踪 release——随 v* tag 移动的「已发布」指针（CI tag 语义见
    # .github/workflows/build-image.yml）；latest 是每个 main commit 的开发态，
    # 不作生产默认。公开包零认证拉。
    image: ghcr.io/damaged-soda/conduit:${CONDUIT_IMAGE_TAG:-release}
    # 默认卫生位：裸 up 也先尝试拉新。注意它不构成 fail-loud——Compose 对带
    # build 的服务会吞拉取错误回退构建，生产必须走文件头的显式序列；
    # 本地开发用 `up -d --build` 显式覆盖为现构建（会以上面的 image 名打 tag）。
    pull_policy: always
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      CONDUIT_DB: /data/conduit.db
      # mesh 直连注入的默认值是 Tailscale 全网通用常量（通用后缀 ts.net、
      # MagicDNS resolver），不是本 tailnet 特有名——app 侧继续不内置任何
      # 具体 tailnet 名（见 service/app.py _mesh_domain_suffixes）。
      CONDUIT_MESH_DOMAIN_SUFFIXES: ${CONDUIT_MESH_DOMAIN_SUFFIXES:-ts.net}
      CONDUIT_MESH_DNS_SERVER: ${CONDUIT_MESH_DNS_SERVER:-100.100.100.100}
    volumes:
      - conduit-data:/data            # DB 持久化（含明文凭据，留在 rig 磁盘，别外泄）
    ports:
      # 默认只绑宿主 localhost（无认证别裸暴露、别绑 0.0.0.0）；
      # 私有网访问走宿主 Tailscale Serve，不改这里。
      - "${CONDUIT_BIND:-127.0.0.1}:${CONDUIT_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/',timeout=5).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  conduit-data:
